<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNW — Broadcast Archive</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:ital,wght@0,300;0,400;1,300&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:        #080808;
      --card:         #141414;
      --card2:        #1a1a1a;
      --border:       #2a2a2a;
      --red:          #E8230A;
      --red-dim:      #9e1a07;
      --green:        #2a7a3a;
      --green-bright: #4caf62;
      --cyan:         #00C8C8;
      --cyan-dim:     #005a5a;
      --white:        #f0f0f0;
      --muted:        #767676;  /* min 4.5:1 on --black */
      --muted2:       #888;
      --yellow:       #f0c040;
      --orange:       #ff8c00;
      --sidebar-w:    220px;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'IBM Plex Mono', monospace;
      min-height: 100vh;
    }

    /* ── LOGIN ── */
    #login-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .login-card {
      background: var(--card); border: 1px solid var(--border);
      padding: 40px 36px; width: min(360px, 100%); text-align: center;
    }
    .login-title { font-family: 'Archivo Black', sans-serif; font-size: 1.4rem; margin-bottom: 6px; }
    .login-sub { font-size: 0.62rem; color: var(--muted2); letter-spacing: 0.1em; margin-bottom: 28px; text-transform: uppercase; }
    .login-input {
      width: 100%; background: #0e0e0e; border: 1px solid var(--border);
      color: var(--white); font-family: 'IBM Plex Mono', monospace;
      font-size: 0.9rem; padding: 12px 16px; outline: none; text-align: center;
      letter-spacing: 0.2em; margin-bottom: 12px; transition: border-color 0.2s;
    }
    .login-input:focus { border-color: var(--red); }
    .login-btn {
      width: 100%; background: var(--red); color: white; border: none;
      font-family: 'Archivo Black', sans-serif; font-size: 1rem;
      letter-spacing: 0.06em; padding: 12px; cursor: pointer; transition: background 0.2s;
    }
    .login-btn:hover { background: #c01e07; }
    .login-error { font-size: 0.62rem; color: var(--red); letter-spacing: 0.1em; margin-top: 10px; display: none; }

    /* ── APP SHELL ── */
    #app { display: none; min-height: 100vh; }

    /* ── TOPBAR ── */
    .topbar {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 0 24px; height: 52px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .topbar-left { display: flex; align-items: center; gap: 14px; }
    .topbar-brand { font-family: 'Archivo Black', sans-serif; font-size: 0.95rem; letter-spacing: 0.04em; }
    .topbar-brand span { color: var(--red); }
    .admin-badge {
      font-size: 0.48rem; letter-spacing: 0.2em; text-transform: uppercase;
      background: var(--red); color: white; padding: 3px 7px;
    }
    .topbar-right { display: flex; align-items: center; gap: 14px; }
    .topbar-date { font-size: 0.55rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted2); }
    .topbar-link {
      font-size: 0.52rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted2); text-decoration: none; border: 1px solid var(--border);
      padding: 4px 10px; transition: all 0.2s;
    }
    .topbar-link:hover { color: var(--white); border-color: var(--white); }
    .logout-btn {
      background: none; border: none; font-family: 'IBM Plex Mono', monospace;
      font-size: 0.52rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); cursor: pointer; padding: 4px 8px;
    }
    .logout-btn:hover { color: var(--red); }

    /* ── LAYOUT ── */
    .layout { display: flex; min-height: calc(100vh - 52px); }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar-w); flex-shrink: 0;
      border-right: 1px solid var(--border);
      background: var(--card); position: sticky;
      top: 52px; height: calc(100vh - 52px); overflow-y: auto;
      display: flex; flex-direction: column;
    }
    .sidebar-section { padding: 20px 16px 8px; }
    .sidebar-section-label {
      font-size: 0.44rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px; padding: 0 4px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; font-size: 0.7rem; letter-spacing: 0.05em;
      color: var(--muted2); text-decoration: none; transition: all 0.15s;
      border: 1px solid transparent; position: relative;
    }
    .nav-item:hover { color: var(--white); background: var(--card2); border-color: var(--border); }
    .nav-item.active { color: var(--white); background: var(--card2); border-color: var(--border); }
    .nav-item.active::before {
      content: ''; position: absolute; left: -1px; top: 0; bottom: 0;
      width: 2px; background: var(--red);
    }
    .nav-icon { font-size: 0.85rem; width: 16px; text-align: center; flex-shrink: 0; }
    .sidebar-divider { border: none; border-top: 1px solid var(--border); margin: 8px 16px; }
    .sidebar-bottom { margin-top: auto; padding: 16px; border-top: 1px solid var(--border); }

    /* ── MAIN ── */
    .main {
      flex: 1; padding: 28px 24px 60px;
      overflow: hidden;
    }

    /* ── ARCHIVE LAYOUT ── */
    .archive-wrap {
      display: flex; gap: 20px; align-items: flex-start;
      max-width: 1100px;
    }

    /* ── DATE RAIL ── */
    .date-rail {
      width: 200px; flex-shrink: 0;
      background: var(--card); border: 1px solid var(--border);
      max-height: calc(100vh - 52px - 60px);
      overflow-y: auto;
      position: sticky; top: 80px;
    }
    .date-rail-header {
      padding: 12px 14px; border-bottom: 1px solid var(--border);
      font-size: 0.44rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); display: flex; align-items: center; justify-content: space-between;
    }
    .date-rail-header strong { color: var(--muted2); }
    .month-label {
      font-size: 0.4rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); padding: 8px 14px 4px;
      background: var(--card); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 2;
    }
    .day-item {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 14px; cursor: pointer;
      border-bottom: 1px solid var(--border);
      border-left: 2px solid transparent;
      transition: all 0.12s;
    }
    .day-item:hover { background: var(--card2); }
    .day-item.active { background: var(--card2); border-left-color: var(--red); }
    .day-item-date {
      flex: 1; font-size: 0.6rem; letter-spacing: 0.04em;
    }
    .day-item-date .day-name {
      font-size: 0.42rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); display: block; margin-bottom: 1px;
    }
    .day-item-date.is-today .day-name { color: var(--cyan); }
    .day-item-score {
      font-family: 'Archivo Black', sans-serif; font-size: 0.85rem;
      flex-shrink: 0; min-width: 20px; text-align: right;
    }
    .day-item-dot {
      width: 5px; height: 5px; border-radius: 50%;
      flex-shrink: 0; background: var(--border);
    }
    .day-item-dot.posted { background: var(--green-bright); }

    /* ── DETAIL PANE ── */
    .detail-pane { flex: 1; min-width: 0; }

    .detail-empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 300px; color: var(--muted); font-size: 0.7rem; letter-spacing: 0.1em;
      text-transform: uppercase; border: 1px solid var(--border); background: var(--card);
    }

    /* ── CARDS ── */
    .card { background: var(--card); border: 1px solid var(--border); margin-bottom: 16px; }
    .card-header {
      padding: 12px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    }
    .card-title {
      font-family: 'Archivo Black', sans-serif; font-size: 0.78rem;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .card-meta { font-size: 0.52rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted2); }
    .card-body { padding: 20px; }

    /* ── STATUS BADGES ── */
    .badge-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .badge {
      font-size: 0.44rem; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 3px 8px; border: 1px solid currentColor;
    }
    .badge-posted  { color: var(--green-bright); }
    .badge-pending { color: var(--muted2); }
    .badge-failed  { color: var(--red); }
    .badge-alert-hot    { color: var(--red); }
    .badge-alert-cold   { color: var(--cyan); }
    .badge-alert-storm  { color: var(--yellow); }

    /* ── SCORE DISPLAY ── */
    .score-display {
      display: flex; align-items: baseline; gap: 4px;
    }
    .score-num {
      font-family: 'Archivo Black', sans-serif; font-size: 2.6rem; line-height: 1;
    }
    .score-denom {
      font-size: 0.65rem; color: var(--muted2); letter-spacing: 0.06em;
    }

    /* ── CONDITIONS GRID ── */
    .cond-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
      background: var(--border);
    }
    .cond-tile {
      background: var(--card2); padding: 14px 16px;
    }
    .cond-label {
      font-size: 0.4rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 6px;
    }
    .cond-val {
      font-family: 'Archivo Black', sans-serif; font-size: 1.3rem; line-height: 1;
    }
    .cond-sub {
      font-size: 0.44rem; letter-spacing: 0.06em; color: var(--muted2); margin-top: 2px;
    }

    /* ── PENALTIES ── */
    .penalty-list {
      display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 20px;
      border-top: 1px solid var(--border);
    }
    .penalty-tag {
      font-size: 0.44rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted2); border: 1px solid var(--border); padding: 2px 8px;
    }

    /* ── SYNOPSIS ── */
    .synopsis-text {
      font-size: 0.95rem; line-height: 1.6; letter-spacing: 0.02em;
      color: var(--white); padding: 20px;
      border-top: 1px solid var(--border);
      font-style: italic;
    }
    .synopsis-none {
      padding: 20px; color: var(--muted); font-size: 0.65rem; font-style: italic;
    }

    /* ── HAIR ── */
    .hair-badge {
      display: inline-block;
      font-size: 0.48rem; letter-spacing: 0.14em; text-transform: uppercase;
      padding: 4px 10px; border: 1px solid currentColor; margin-left: 12px;
    }

    /* ── OUTFIT ── */
    .outfit-section { padding: 16px 20px; }
    .outfit-block { margin-bottom: 12px; }
    .outfit-block:last-child { margin-bottom: 0; }
    .outfit-time {
      font-size: 0.4rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 6px;
    }
    .outfit-items { display: flex; gap: 8px; flex-wrap: wrap; }
    .outfit-item {
      font-size: 0.52rem; letter-spacing: 0.1em; text-transform: uppercase;
      border: 1px solid var(--border); padding: 3px 8px; color: var(--muted2);
    }

    /* ── GRAPHIC ── */
    .graphic-section {
      padding: 20px; display: flex; gap: 20px; align-items: flex-start;
    }
    .graphic-thumb {
      width: 120px; flex-shrink: 0;
      border: 1px solid var(--border);
      display: block;
    }
    .graphic-thumb img {
      width: 100%; display: block;
    }
    .graphic-thumb-empty {
      width: 120px; height: 150px; flex-shrink: 0;
      background: var(--card2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.4rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
    }
    .graphic-meta { flex: 1; min-width: 0; }
    .graphic-meta-row {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 8px 0; border-bottom: 1px solid var(--border);
      font-size: 0.6rem;
    }
    .graphic-meta-row:last-child { border-bottom: none; }
    .graphic-meta-label {
      font-size: 0.42rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted); flex-shrink: 0; width: 80px; padding-top: 2px;
    }
    .graphic-meta-val { color: var(--muted2); word-break: break-all; }
    .graphic-meta-val a { color: var(--cyan); text-decoration: none; }
    .graphic-meta-val a:hover { text-decoration: underline; }

    /* ── LOADING ── */
    .loading-text { color: var(--muted); font-style: italic; font-size: 0.75rem; animation: pulse 1.5s ease infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── MOBILE ── */
    @media (max-width: 900px) {
      .archive-wrap { flex-direction: column; }
      .date-rail { width: 100%; max-height: 220px; position: static; }
    }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { padding: 16px 16px 48px; }
      .cond-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 500px) {
      .topbar { padding: 0 16px; }
      .topbar-date { display: none; }
    }
  </style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-title">CNW<span style="color:var(--red)">·</span></div>
    <div class="login-sub">Control Room</div>
    <input class="login-input" type="password" id="pw-input" placeholder="password"
      onkeydown="if(event.key==='Enter')tryLogin()">
    <button class="login-btn" onclick="tryLogin()">Enter</button>
    <div class="login-error" id="login-error">wrong password</div>
  </div>
</div>

<!-- ── APP ── -->
<div id="app">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-brand">Classic<span>New</span>Wave</div>

    </div>
    <div class="topbar-right">
      <div class="topbar-date" id="topbar-date">—</div>
      <a href="index.html" class="topbar-link" target="_blank">Site ↗</a>
      <button class="logout-btn" onclick="logout()">Log out</button>
    </div>
  </div>

  <!-- LAYOUT -->
  <div class="layout">

    <!-- SIDEBAR -->
    <nav class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-section-label">Today's Broadcast</div>
        <a href="control-room.html" class="nav-item">
          <span class="nav-icon">◉</span> Control Room
        </a>
        <a href="weather.html" class="nav-item">
          <span class="nav-icon">◎</span> Weather
        </a>
        <a href="editorial.html" class="nav-item">
          <span class="nav-icon">◎</span> Editorial
        </a>
        <a href="graphics.html" class="nav-item">
          <span class="nav-icon">◎</span> Graphics
        </a>
        <a href="publishing.html" class="nav-item">
          <span class="nav-icon">◎</span> Publishing
        </a>
      </div>
      <hr class="sidebar-divider">
      <div class="sidebar-section">
        <div class="sidebar-section-label">Library</div>
        <a href="broadcast-archive.html" class="nav-item active">
          <span class="nav-icon">◉</span> Broadcast Archive
        </a>
        <a href="audience-report.html" class="nav-item">
          <span class="nav-icon">◎</span> Audience Report
        </a>
      </div>
      <div class="sidebar-bottom">
        <a href="admin.html" class="nav-item" style="font-size:0.6rem;padding:6px 10px">
          <span class="nav-icon" style="font-size:0.7rem">←</span> Full Admin
        </a>
      </div>
    </nav>

    <!-- MAIN -->
    <main class="main">
      <div class="archive-wrap">

        <!-- DATE RAIL -->
        <div class="date-rail">
          <div class="date-rail-header">
            Archive <strong id="rail-count">—</strong>
          </div>
          <div id="date-rail-list">
            <div style="padding:16px"><span class="loading-text">loading…</span></div>
          </div>
        </div>

        <!-- DETAIL PANE -->
        <div class="detail-pane" id="detail-pane">
          <div class="detail-empty">select a broadcast day</div>
        </div>

      </div>
    </main>

  </div><!-- /layout -->
</div><!-- /app -->

<script>
  // ── AUTH ──────────────────────────────────────────────────────────────────
  const ADMIN_PW = 'cnw2026';

  function tryLogin() {
    const val = document.getElementById('pw-input').value;
    if (val === ADMIN_PW) {
      sessionStorage.setItem('cnw_auth', '1');
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      init();
    } else {
      document.getElementById('login-error').style.display = 'block';
    }
  }

  function logout() {
    sessionStorage.removeItem('cnw_auth');
    location.reload();
  }

  if (sessionStorage.getItem('cnw_auth') === '1') {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }

  // ── TOPBAR DATE ───────────────────────────────────────────────────────────
  function setTopbarDate() {
    const s = new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/New_York',
      weekday: 'short', month: 'short', day: 'numeric'
    }).format(new Date());
    document.getElementById('topbar-date').textContent = s.toUpperCase();
  }

  // ── OUTFIT ───────────────────────────────────────────────────────────────
  function outfitItems(temp, precip) {
    const items = [];
    if      (temp < 55) items.push('HOODIE');
    else if (temp < 65) items.push('LAYER UP');
    else if (temp < 75) items.push('TEE');
    else                items.push('TANK');

    if      (temp >= 65) items.push('SHORTS');
    else if (temp >= 50) items.push('JOGGERS');
    else                 items.push('JEANS');

    if (precip > 40)    items.push('BOOTS');
    else if (temp < 50) items.push('BOOTS');
    else if (temp >= 75) items.push('SANDALS');
    else                 items.push('SNEAKERS');

    if (precip > 40) items.push('UMBRELLA');
    return items;
  }

  // ── HAIR ─────────────────────────────────────────────────────────────────
  function hairLevel(humidity, precip) {
    let level;
    if      (humidity >= 85) level = 'SILK PRESS WARNING';
    else if (humidity >= 75) level = 'HIGH HUMIDITY ALERT';
    else if (humidity >= 65) level = 'MODERATE RISK';
    else if (humidity >= 55) level = 'LOW RISK';
    else                     level = 'GOOD HAIR DAY';

    if      (precip > 60) level = bump(level, 'SILK PRESS WARNING');
    else if (precip > 40) level = bump(level, 'HIGH HUMIDITY ALERT');
    else if (precip > 25) level = bump(level, 'MODERATE RISK');
    return level;
  }

  const HAIR_ORDER = ['GOOD HAIR DAY','LOW RISK','MODERATE RISK','HIGH HUMIDITY ALERT','SILK PRESS WARNING'];
  function bump(current, min) {
    return HAIR_ORDER.indexOf(min) > HAIR_ORDER.indexOf(current) ? min : current;
  }

  function hairColor(level) {
    if (level === 'GOOD HAIR DAY')       return 'var(--green-bright)';
    if (level === 'LOW RISK')            return 'var(--cyan)';
    if (level === 'MODERATE RISK')       return 'var(--yellow)';
    if (level === 'HIGH HUMIDITY ALERT') return 'var(--orange)';
    return 'var(--red)';
  }

  // ── SCORE COLOR ───────────────────────────────────────────────────────────
  function scoreColor(s) {
    if (s === 10) return 'var(--cyan)';
    if (s >= 8)   return 'var(--green-bright)';
    if (s >= 6)   return 'var(--yellow)';
    return 'var(--red)';
  }

  // ── DATE HELPERS ──────────────────────────────────────────────────────────
  const TODAY_KEY = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' }).format(new Date());

  function parseKey(dk) {
    // Parse "YYYY-MM-DD" safely without relying on string+time concatenation
    if (!dk || typeof dk !== 'string') return null;
    const [y, m, d] = dk.split('-').map(Number);
    if (!y || !m || !d) return null;
    return new Date(y, m - 1, d, 12, 0, 0);
  }

  function fmtDateKey(dk) {
    const d = parseKey(dk);
    if (!d) return dk || '—';
    return new Intl.DateTimeFormat('en-US', {
      month: 'long', day: 'numeric', year: 'numeric'
    }).format(d).toUpperCase();
  }

  function dayName(dk) {
    const d = parseKey(dk);
    if (!d) return '—';
    return new Intl.DateTimeFormat('en-US', { weekday: 'long' }).format(d).toUpperCase();
  }

  function monthLabel(dk) {
    const d = parseKey(dk);
    if (!d) return '—';
    return new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric' }).format(d).toUpperCase();
  }

  function fmtTs(ts) {
    if (!ts) return '—';
    return new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/New_York',
      month: 'short', day: 'numeric',
      hour: 'numeric', minute: '2-digit',
      hour12: true
    }).format(new Date(ts));
  }

  // ── RENDER DATE RAIL ──────────────────────────────────────────────────────
  let rows = [];
  let selectedKey = null;

  function renderRail(data) {
    rows = data;
    document.getElementById('rail-count').textContent = `${data.length} days`;

    let html = '';
    let lastMonth = null;
    data.forEach(row => {
      const m = monthLabel(row.date_key);
      if (m !== lastMonth) {
        html += `<div class="month-label">${m}</div>`;
        lastMonth = m;
      }
      const isToday = row.date_key === TODAY_KEY;
      const posted = row.ig_posted;
      const sc = row.score;
      html += `
        <div class="day-item${isToday ? '' : ''}" id="day-${row.date_key}" onclick="selectDay('${row.date_key}')">
          <div class="day-item-date${isToday ? ' is-today' : ''}">
            <span class="day-name">${dayName(row.date_key).slice(0,3)}${isToday ? ' · TODAY' : ''}</span>
            ${row.date_key.slice(5)}
          </div>
          <div class="day-item-score" style="color:${sc ? scoreColor(sc) : 'var(--muted)'}">${sc != null ? sc : '—'}</div>
          <div class="day-item-dot${posted ? ' posted' : ''}"></div>
        </div>`;
    });

    document.getElementById('date-rail-list').innerHTML = html;
  }

  // ── SELECT DAY ────────────────────────────────────────────────────────────
  function selectDay(dateKey) {
    if (selectedKey) {
      const prev = document.getElementById(`day-${selectedKey}`);
      if (prev) prev.classList.remove('active');
    }
    selectedKey = dateKey;
    const el = document.getElementById(`day-${dateKey}`);
    if (el) el.classList.add('active');
    const row = rows.find(r => r.date_key === dateKey);
    if (row) renderDetail(row);
  }

  // ── RENDER DETAIL ─────────────────────────────────────────────────────────
  function renderDetail(row) {
    const high = row.high != null ? Math.round(row.high) : null;
    const low  = row.low  != null ? Math.round(row.low)  : null;
    const sc   = row.score;
    const isToday = row.date_key === TODAY_KEY;

    // Status badges
    let igBadge = '';
    if (row.ig_posted) {
      igBadge = `<span class="badge badge-posted">IG Posted</span>`;
    } else {
      igBadge = `<span class="badge badge-pending">IG Pending</span>`;
    }
    let alertBadge = '';
    if (row.alert_flag) {
      const cls = `badge-alert-${row.alert_flag}`;
      alertBadge = `<span class="badge ${cls}">Alert: ${row.alert_flag.toUpperCase()}</span>`;
    }
    const todayBadge = isToday ? `<span class="badge" style="color:var(--cyan)">Today</span>` : '';

    // Conditions
    const condFields = [
      { label: 'High / Low', val: high != null ? `${high}°F` : '—', sub: low != null ? `Low ${low}°F` : '' },
      { label: 'Condition',  val: row.condition || '—', sub: '' },
      { label: 'Feels Like', val: row.feels_like != null ? `${Math.round(row.feels_like)}°F` : '—', sub: '' },
      { label: 'Humidity',   val: row.humidity   != null ? `${row.humidity}%` : '—', sub: '' },
      { label: 'Precip',     val: row.precip_chance != null ? `${row.precip_chance}%` : '—', sub: '' },
      { label: 'Wind',       val: row.wind_speed != null ? `${row.wind_speed} mph` : '—', sub: '' },
    ];
    const condHTML = condFields.map(f => `
      <div class="cond-tile">
        <div class="cond-label">${f.label}</div>
        <div class="cond-val">${f.val}</div>
        ${f.sub ? `<div class="cond-sub">${f.sub}</div>` : ''}
      </div>`).join('');

    // Penalties
    const pens = Array.isArray(row.penalties) ? row.penalties : [];
    const penHTML = pens.length
      ? `<div class="penalty-list">${pens.map(p => `<span class="penalty-tag">${p}</span>`).join('')}</div>`
      : '';

    // Synopsis
    const synHTML = row.synopsis_approved
      ? `<div class="synopsis-text">"${row.synopsis_approved}"</div>`
      : `<div class="synopsis-none">No synopsis recorded.</div>`;

    // Hair
    const hair = (row.humidity != null && row.precip_chance != null)
      ? hairLevel(row.humidity, row.precip_chance) : null;
    const hairHTML = hair
      ? `<span class="hair-badge" style="color:${hairColor(hair)}">${hair}</span>` : '';

    // Outfit
    let outfitHTML = '';
    if (high != null) {
      const dayItems = outfitItems(high, row.precip_chance || 0);
      const showNight = low != null && (high - low) >= 15;
      const nightItems = showNight ? outfitItems(low, row.precip_chance || 0) : [];

      outfitHTML = `<div class="outfit-section">`;
      if (showNight) {
        outfitHTML += `
          <div class="outfit-block">
            <div class="outfit-time">Day · ${high}°F high</div>
            <div class="outfit-items">${dayItems.map(i => `<span class="outfit-item">${i}</span>`).join('')}</div>
          </div>
          <div class="outfit-block">
            <div class="outfit-time">Night · ${low}°F low</div>
            <div class="outfit-items">${nightItems.map(i => `<span class="outfit-item">${i}</span>`).join('')}</div>
          </div>`;
      } else {
        outfitHTML += `
          <div class="outfit-block">
            <div class="outfit-time">Outfit</div>
            <div class="outfit-items">${dayItems.map(i => `<span class="outfit-item">${i}</span>`).join('')}</div>
          </div>`;
      }
      outfitHTML += `</div>`;
    }

    // IG graphic + meta
    const graphicHTML = (() => {
      const thumb = row.feed_image_url
        ? `<div class="graphic-thumb"><img src="${row.feed_image_url}" alt="feed graphic" loading="lazy"></div>`
        : `<div class="graphic-thumb-empty">No graphic</div>`;

      const postLink = row.ig_post_id
        ? `<a href="https://www.instagram.com/p/${row.ig_post_id}/" target="_blank">instagram.com/p/${row.ig_post_id}/</a>`
        : '—';

      const alertLine = row.alert_flag ? `
        <div class="graphic-meta-row">
          <div class="graphic-meta-label">Alert post</div>
          <div class="graphic-meta-val">${row.alert_ig_posted ? `Posted · ${row.alert_ig_post_id || ''}` : 'Not posted'}</div>
        </div>` : '';

      const captionLine = row.ig_caption ? `
        <div class="graphic-meta-row">
          <div class="graphic-meta-label">Caption</div>
          <div class="graphic-meta-val" style="white-space:pre-wrap;line-height:1.5">${row.ig_caption}</div>
        </div>` : '';

      return `
        <div class="graphic-section">
          ${thumb}
          <div class="graphic-meta">
            <div class="graphic-meta-row">
              <div class="graphic-meta-label">IG Status</div>
              <div class="graphic-meta-val">${row.ig_posted ? `Posted · ${fmtTs(row.ig_posted_at)}` : 'Not posted'}</div>
            </div>
            <div class="graphic-meta-row">
              <div class="graphic-meta-label">Post link</div>
              <div class="graphic-meta-val">${postLink}</div>
            </div>
            ${alertLine}
            ${captionLine}
          </div>
        </div>`;
    })();

    // Build page
    const html = `
      <!-- HEADER CARD -->
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">${fmtDateKey(row.date_key)}</div>
            <div class="card-meta" style="margin-top:4px">${dayName(row.date_key)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
            <div class="score-display">
              <div class="score-num" style="color:${sc ? scoreColor(sc) : 'var(--muted)'}">${sc != null ? sc : '—'}</div>
              <div class="score-denom">/10</div>
            </div>
            <div class="badge-row">
              ${todayBadge}${igBadge}${alertBadge}
            </div>
          </div>
        </div>
        <div class="cond-grid">${condHTML}</div>
        ${penHTML}
      </div>

      <!-- EDITORIAL CARD -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">Editorial</div>
          <div style="display:flex;align-items:center">
            <div class="card-meta">Synopsis</div>
            ${hairHTML}
          </div>
        </div>
        ${synHTML}
        ${outfitHTML}
      </div>

      <!-- BROADCAST CARD -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">Broadcast</div>
          <div class="card-meta">IG graphic + post status</div>
        </div>
        ${graphicHTML}
      </div>
    `;

    document.getElementById('detail-pane').innerHTML = html;
  }

  // ── INIT ──────────────────────────────────────────────────────────────────
  async function init() {
    setTopbarDate();

    try {
      const res = await fetch('/.netlify/functions/get-archive?limit=90');
      const data = await res.json();
      const archiveRows = data.rows || [];

      if (archiveRows.length === 0) {
        document.getElementById('date-rail-list').innerHTML =
          '<div style="padding:16px;color:var(--muted);font-size:0.6rem">No data yet.</div>';
        return;
      }

      renderRail(archiveRows);

      // Auto-select today or most recent
      const todayRow = archiveRows.find(r => r.date_key === TODAY_KEY);
      const firstRow = archiveRows[0];
      selectDay(todayRow ? TODAY_KEY : firstRow.date_key);

    } catch (err) {
      document.getElementById('date-rail-list').innerHTML =
        `<div style="padding:16px;color:var(--red);font-size:0.6rem">Error: ${err.message}</div>`;
    }
  }

  // Auto-init if already authed
  if (sessionStorage.getItem('cnw_auth') === '1') init();
</script>
</body>
</html>
