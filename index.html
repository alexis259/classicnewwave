<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classic New Wave — Coming Back Soon</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#080808" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CNW" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;1,300&family=Archivo+Black&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #080808;
      --red: #E8230A;
      --white: #f0f0f0;
      --muted: #555;
    }

    html, body {
      background: var(--black);
      color: var(--white);
      font-family: 'IBM Plex Mono', monospace;
      min-height: 100vh;
      overflow: hidden;
    }

    /* film grain */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 999;
      mix-blend-mode: overlay;
    }

    /* scanlines */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.08) 3px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 998;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }

    .logo {
      font-family: 'Archivo Black', sans-serif;
      font-size: clamp(13px, 2vw, 16px);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 48px;
    }

    .logo span {
      color: var(--red);
    }

    .headline {
      font-family: 'IBM Plex Mono', monospace;
      font-size: clamp(36px, 10vw, 96px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--white);
      margin-bottom: 8px;
    }

    .headline .red {
      color: var(--red);
    }

    .subhead {
      font-size: clamp(11px, 2vw, 13px);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 56px;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: var(--red);
      margin: 0 auto 40px;
    }

    .message {
      font-size: clamp(13px, 2.5vw, 15px);
      line-height: 1.7;
      color: #999;
      max-width: 420px;
      margin-bottom: 56px;
    }

    .message strong {
      color: var(--white);
      font-weight: 400;
    }

    .ig-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid #2a2a2a;
      padding: 12px 24px;
      transition: color 0.2s, border-color 0.2s;
    }

    .ig-link:hover {
      color: var(--white);
      border-color: var(--red);
    }

    .ig-link svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .footer {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="page">

    <div class="logo">Classic <span>New</span> Wave &mdash; NYC</div>

    <div class="headline">BE<span class="red">BACK</span><br>SOON.</div>

    <div class="subhead">We're refreshing the experience</div>

    <div class="divider"></div>

    <p class="message">
      <strong>classicnewweather.com</strong> is temporarily offline while we work on something new.<br><br>
      Daily NYC weather scores will return shortly.
    </p>

    <a class="ig-link" href="https://instagram.com/classicnewweather" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
      </svg>
      @classicnewweather
    </a>

  </div>

  <div class="footer">classicnewweather.com &mdash; NYC weather, scored.</div>

</body>
</html>
